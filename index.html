<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>懷舊放大鏡 - Nostalgic Trivia Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: #120b08;
            color: #fef08a;
            user-select: none;
            touch-action: manipulation;
        }

        .font-black-shadow { font-weight: 900; text-shadow: 2px 2px 0px #78350f, -1px -1px 0px #000; }
        .title-shadow { font-weight: 900; text-shadow: 4px 4px 0px #78350f, -2px -2px 0px #000; }

        .retro-btn {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #451a03;
            border: 3px solid #fef3c7;
            box-shadow: 0 6px 0 #78350f, 0 8px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            cursor: pointer;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            font-weight: 900;
        }
        .retro-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #78350f, 0 2px 4px rgba(0,0,0,0.5); }

        .sunburst-bg { background: repeating-conic-gradient(from 0deg, #78350f 0deg 15deg, #451a03 15deg 30deg); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2e1505; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-start gap-1 md:gap-2 pt-1 pb-4 px-2 sm:px-4 md:pt-2 md:pb-6 md:px-6 lg:px-8 max-w-[1024px] mx-auto box-border bg-[#120b08] font-sans selection:bg-amber-500/30">

    <header class="w-full flex justify-between items-center px-2 md:px-4 shrink-0 py-1 md:py-2 z-50 relative">
        <div class="flex items-center gap-2 md:gap-3 shrink-0 flex-1">
            <i class="fa-solid fa-magnifying-glass text-amber-500 text-2xl md:text-4xl drop-shadow-md"></i>
            <h1 class="text-2xl md:text-4xl font-black tracking-wide text-amber-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] whitespace-nowrap">懷舊放大鏡</h1>
        </div>
        <div id="header-score" class="hidden text-yellow-400 font-black flex items-center justify-center gap-2 text-xl md:text-3xl drop-shadow-md shrink-0">
            <i class="fa-solid fa-coins"></i> <span class="hidden sm:inline">得分:</span> <span id="score-display" class="text-white">0</span>
        </div>
        <div class="flex items-center justify-end shrink-0 flex-1">
            <button id="btn-museum-top" onclick="showScreen('museum')" class="px-3 py-2 sm:px-4 sm:py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-black text-sm sm:text-xl flex items-center gap-2 shadow-md border-2 border-amber-400 transition-transform active:scale-95">
                <i class="fa-solid fa-book-open"></i> <span class="hidden sm:inline">懷舊展覽館</span>
            </button>
            <button id="btn-back-menu" onclick="showScreen('menu')" class="hidden px-4 py-2 sm:px-6 sm:py-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-black text-base sm:text-xl flex items-center gap-2 shadow-md border-2 border-orange-400 transition-transform active:scale-95">
                <span class="hidden sm:inline">返回</span><span class="sm:hidden"><i class="fa-solid fa-arrow-left"></i> 返回</span>
            </button>
        </div>
    </header>

    <main class="w-full flex-1 min-h-0 flex flex-col relative mt-1 mb-2 md:mt-1 md:mb-4 bg-stone-900 rounded-[2rem] md:rounded-[3rem] shadow-[0_10px_40px_rgba(0,0,0,0.8)] border-[6px] md:border-[10px] border-amber-900/60 overflow-hidden">
        
        <!-- SCREEN 1: MENU -->
        <div id="screen-menu" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 md:p-12 sunburst-bg text-center overflow-y-auto">
            <div class="mb-8 md:mb-12 animate-bounce">
                <h2 class="text-6xl md:text-8xl text-amber-300 title-shadow tracking-wider leading-tight drop-shadow-2xl">懷舊放大鏡</h2>
            </div>
            <div class="flex items-center justify-center w-full max-w-3xl mb-8 md:mb-12">
                <div class="bg-amber-100/95 border-4 md:border-8 border-amber-900 rounded-3xl p-6 md:p-8 shadow-2xl w-full text-amber-950 text-left">
                    <div class="flex flex-col gap-4">
                        <div class="flex items-start gap-4 md:gap-6 border-b-4 border-amber-800/30 pb-4 md:pb-6">
                            <span class="text-5xl md:text-7xl shrink-0 mt-2">🔍</span>
                            <div>
                                <h3 class="font-black text-3xl md:text-4xl text-red-800 mb-3">懷舊放大鏡玩法！</h3>
                                <p class="text-xl md:text-2xl font-bold text-amber-900 leading-snug">畫面上的物品會被隱蔽在黑暗中。請 <span class="bg-yellow-400 text-red-800 px-2 py-0.5 rounded-lg shadow-sm border-2 border-red-800/20">拖曳放大鏡</span> 探索局部細節，並根據提示猜出答案！</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="w-full max-w-xl">
                <button onclick="startGame()" class="retro-btn w-full py-5 md:py-6 rounded-3xl text-3xl md:text-4xl flex items-center justify-center gap-4 transition-transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-play"></i> 開始遊戲
                </button>
            </div>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="screen-game" class="absolute inset-0 z-20 hidden flex-col justify-start gap-2 md:gap-4 p-3 md:p-6 bg-stone-900 overflow-hidden">
            <div class="shrink-0 flex items-center bg-amber-950 text-amber-100 px-4 py-2.5 md:px-6 md:py-4 rounded-2xl border-2 md:border-4 border-amber-700/60 shadow-lg mb-1 md:mb-2 gap-3 md:gap-4">
                <span id="question-number-badge" class="bg-red-600 text-white font-black-shadow px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-base md:text-xl shadow-inner shrink-0">第一題</span>
                <div class="font-black text-sm md:text-2xl flex items-center gap-2 flex-1 min-w-0">
                    <i class="fa-solid fa-magnifying-glass text-amber-400 animate-pulse shrink-0"></i> 
                    <span class="truncate">請拖曳尋找線索：<span id="category-badge" class="text-amber-300 ml-1">提示</span></span>
                </div>
            </div>

            <div class="flex-1 min-h-0 w-full flex flex-col md:flex-row items-start gap-4 lg:gap-6 overflow-hidden">
                <div class="w-full md:w-[55%] lg:w-[60%] flex flex-col items-start justify-start h-full min-h-[40vh] md:min-h-0 overflow-hidden">
                    <div class="relative flex-1 w-full rounded-3xl md:rounded-[3rem] border-[6px] md:border-[10px] border-amber-500 shadow-[0_0_30px_rgba(245,158,11,0.6)] overflow-hidden bg-stone-950 shrink-0">
                        <canvas id="clue-1" class="absolute inset-0 w-full h-full object-cover touch-none cursor-move"></canvas>
                        <div class="absolute inset-0 shadow-[inset_0_0_25px_rgba(0,0,0,0.85)] pointer-events-none z-20"></div>
                    </div>
                </div>

                <div class="w-full md:w-[45%] lg:w-[40%] flex flex-col gap-4 lg:gap-5 overflow-y-auto overflow-x-hidden md:pr-2 pb-4">
                    <div class="w-full flex flex-col gap-2 shrink-0">
                        <div class="text-amber-300 font-bold text-lg md:text-2xl">請選擇正確答案：</div>
                        <div id="options-grid" class="grid grid-cols-2 gap-3 md:gap-4 w-full"></div>
                    </div>
                    <div class="w-full flex flex-col gap-2 shrink-0 mt-2">
                        <div class="text-amber-300 font-bold text-lg md:text-2xl">解難小錦囊：</div>
                        <div class="flex gap-2 lg:gap-3 w-full justify-between">
                            <button onclick="useFiftyFifty()" id="btn-5050" class="flex-1 aspect-[2/1] md:aspect-[3/2] rounded-[2rem] bg-indigo-600 text-white font-black border-[3px] border-indigo-200 shadow-lg text-[13px] md:text-xl active:scale-95 transition-all">50-50 (x<span id="5050-left">3</span>)</button>
                            <button onclick="useSecondClue()" id="btn-second-clue" class="flex-1 aspect-[2/1] md:aspect-[3/2] rounded-[2rem] bg-green-600 text-white font-black border-[3px] border-green-200 shadow-lg text-[13px] md:text-xl active:scale-95 transition-all">額外線索 (x<span id="second-clue-left">3</span>)</button>
                            <button onclick="useHint()" id="btn-hint" class="flex-1 aspect-[2/1] md:aspect-[3/2] rounded-[2rem] bg-orange-600 text-white font-black border-[3px] border-orange-200 shadow-lg text-[13px] md:text-xl active:scale-95 transition-all">文字提示 (x<span id="hint-left">3</span>)</button>
                        </div>
                    </div>
                    <div id="hint-banner" class="hidden w-full bg-amber-50 text-amber-950 font-black px-4 py-3 rounded-2xl border-[4px] border-amber-200 shadow-lg shrink-0 mt-2 text-center text-sm md:text-2xl leading-snug">
                        <span id="hint-text"></span>
                    </div>
                    <div id="clues-container" class="flex flex-row justify-start items-end gap-3 lg:gap-4 w-full mt-auto shrink-0 pt-4">
                        <div class="relative w-[45%] max-w-[140px] lg:max-w-[180px] aspect-square rounded-2xl border-[4px] border-blue-500 shadow-xl overflow-hidden bg-stone-950 shrink-0">
                            <div class="absolute top-0 left-0 bg-blue-500 text-white text-[10px] md:text-sm px-3 py-1 rounded-br-xl font-black z-10">💡 輔助線索</div>
                            <canvas id="clue-2" class="w-full h-full object-cover"></canvas>
                        </div>
                        <div id="clue-3-locked" class="relative w-[45%] max-w-[140px] lg:max-w-[180px] aspect-square rounded-2xl border-[4px] border-stone-600 bg-stone-800 flex flex-col items-center justify-center text-stone-400 shrink-0">
                            <i class="fa-solid fa-lock text-2xl md:text-4xl mb-2"></i><span class="text-[10px] md:text-sm font-black text-center">解鎖線索</span>
                        </div>
                        <div id="clue-3-container" class="hidden relative w-[45%] max-w-[140px] lg:max-w-[180px] aspect-square rounded-2xl border-[4px] border-green-500 overflow-hidden bg-stone-950 shrink-0">
                            <div class="absolute top-0 left-0 bg-green-500 text-white text-[10px] md:text-sm px-3 py-1 rounded-br-xl font-black z-10">💡 額外線索</div>
                            <canvas id="clue-3" class="w-full h-full object-cover"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: REVEAL -->
        <div id="screen-reveal" class="absolute inset-0 z-20 hidden flex-col items-center justify-between p-6 md:p-12 sunburst-bg text-center overflow-y-auto">
            <div class="w-full flex justify-between items-center mb-4">
                <span id="reveal-status-tag" class="bg-green-600 text-white font-black-shadow px-8 py-3 rounded-full text-2xl md:text-4xl border-4 border-green-400">答對了！</span>
                <div id="reveal-points-tag" class="bg-amber-100 text-amber-900 font-black px-6 py-2 rounded-full border-4 border-amber-600 text-xl md:text-3xl">+100 分</div>
            </div>
            <div class="my-auto w-full max-w-3xl bg-amber-50/95 border-8 border-amber-900 rounded-[2.5rem] p-6 md:p-10 shadow-2xl relative flex flex-col items-center">
                <h2 id="reveal-item-title" class="text-5xl md:text-7xl font-black text-red-700 mb-4 md:mb-6 title-shadow"></h2>
                <div class="w-full aspect-[16/9] max-h-[350px] rounded-3xl border-[6px] border-amber-800 overflow-hidden bg-stone-900 mb-6 relative">
                    <canvas id="reveal-canvas" class="w-full h-full object-contain"></canvas>
                </div>
                <p id="reveal-item-desc" class="text-xl md:text-3xl text-amber-950 font-bold bg-amber-200/80 p-5 rounded-2xl border-4 border-amber-400 w-full text-left leading-relaxed"></p>
            </div>
            <button onclick="nextQuestion()" class="retro-btn w-full max-w-lg py-5 mt-4 rounded-3xl text-3xl flex justify-center gap-4 transition-transform active:scale-95">
                下一題 <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- SCREEN 4: RESULT -->
        <div id="screen-result" class="absolute inset-0 z-20 hidden flex-col items-center justify-between p-6 md:p-12 sunburst-bg text-center overflow-y-auto">
            <div class="mt-6 md:mt-8">
                <h2 class="text-5xl md:text-7xl text-amber-300 title-shadow mb-4">遊戲完成！</h2>
                <p class="text-2xl md:text-4xl text-amber-100 font-bold">你的懷舊記憶力測試結果</p>
            </div>
            <div class="w-full max-w-2xl bg-amber-50/95 border-8 border-amber-900 rounded-[3rem] p-8 md:p-12 shadow-2xl text-amber-950 my-auto">
                <div class="text-center mb-8">
                    <span class="text-xl md:text-3xl font-black text-amber-800">最終總得分</span>
                    <div id="final-score" class="text-7xl md:text-9xl font-black text-red-600 my-4 drop-shadow-xl">0</div>
                </div>
                <div class="bg-amber-200/80 p-6 rounded-3xl border-4 border-amber-400 text-center mb-8">
                    <div class="text-xl md:text-2xl text-amber-800 font-black mb-2">獲封稱號</div>
                    <div id="rank-title" class="text-4xl md:text-5xl font-black text-amber-900 mb-4"></div>
                    <p id="rank-desc" class="text-lg md:text-2xl font-bold text-amber-800"></p>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 md:gap-6 w-full max-w-2xl mb-4">
                <button onclick="showScreen('menu')" class="retro-btn flex-1 py-4 md:py-6 rounded-2xl text-xl md:text-3xl font-black flex items-center justify-center gap-3">
                    <i class="fa-solid fa-house"></i> 回主頁
                </button>
                <button onclick="startGame()" class="retro-btn flex-1 py-4 md:py-6 rounded-2xl text-xl md:text-3xl font-black !bg-gradient-to-b !from-green-500 !to-emerald-700 !text-white flex items-center justify-center gap-3">
                    <i class="fa-solid fa-rotate-right"></i> 再玩一次
                </button>
            </div>
        </div>

        <!-- SCREEN 5: MUSEUM -->
        <div id="screen-museum" class="absolute inset-0 z-20 hidden flex-col p-5 md:p-8 bg-stone-900 text-amber-100 overflow-hidden">
            <div class="flex justify-between items-center border-b-[4px] border-amber-800 pb-4 mb-4 shrink-0">
                <h2 class="text-3xl md:text-5xl font-black-shadow text-amber-400 flex items-center gap-3"><i class="fa-solid fa-box-archive"></i> 懷舊展覽館</h2>
                <button onclick="showScreen('menu')" class="px-5 py-3 md:px-8 md:py-4 bg-amber-800 hover:bg-amber-700 text-white rounded-2xl text-xl md:text-2xl font-black border-4 border-amber-600 shadow-lg active:scale-95">返 回 <i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="museum-grid" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-8 pr-2 pb-6"></div>
        </div>
    </main>

    <script>
        const gameState = {
            currentScreen: 'menu', score: 0, streak: 0, maxStreak: 0, correctCount: 0, questionIndex: 0,
            questionsList: [], currentQuestion: null, hintUsed: false, fiftyFiftyUsed: false, secondClueUsed: false,
            hintsLeft: 3, fiftyFiftyLeft: 3, secondCluesLeft: 3, soundEnabled: true
        };

        const interactiveLoupe = {
            x: 0, y: 0, offscreen: null, displayW: 0, displayH: 0,
            radius: window.innerWidth < 768 ? 70 : 110, zoom: 2.8, isDragging: false, eventsInitialized: false
        };

        function drawSunburstBg(ctx, w, h) {
            ctx.save();
            const cx = w / 2, cy = h / 2;
            ctx.fillStyle = '#451a03'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#78350f';
            for (let i = 0; i < 24; i += 2) {
                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, Math.max(w, h) * 1.5, i * (Math.PI / 12), (i + 1) * (Math.PI / 12));
                ctx.fill();
            }
            const grad = ctx.createRadialGradient(cx, cy, w*0.3, cx, cy, w*0.8);
            grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }

        // 圖片輔助函數：加入超強防呆錯誤顯示 (Missing File Fallback)
        function drawImageHelper(url) {
            return function(ctx, w, h) {
                if (typeof drawSunburstBg === 'function') drawSunburstBg(ctx, w, h);
                const img = new Image();
                
                img.onload = () => {
                    if (typeof drawSunburstBg === 'function') drawSunburstBg(ctx, w, h);
                    const scale = Math.min(w / img.width, h / img.height) * 0.9;
                    const iw = img.width * scale; const ih = img.height * scale;
                    const ix = (w - iw) / 2; const iy = (h - ih) / 2;
                    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
                    ctx.drawImage(img, ix, iy, iw, ih); ctx.shadowColor = 'transparent';
                    if (gameState && gameState.currentScreen === 'game' && interactiveLoupe.offscreen) renderLoupe();
                };

                // 當圖片載入失敗時的「防呆」顯示，告訴開發者少了哪一張圖！
                img.onerror = () => {
                    if (typeof drawSunburstBg === 'function') drawSunburstBg(ctx, w, h);
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = '#fef08a';
                    ctx.font = 'bold ' + Math.floor(w/12) + 'px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('圖片準備中...', w/2, h/2 - 20);
                    ctx.font = 'bold ' + Math.floor(w/16) + 'px sans-serif';
                    ctx.fillStyle = '#fca5a5';
                    ctx.fillText('缺少: ' + url.split('/').pop(), w/2, h/2 + 20);
                    if (gameState && gameState.currentScreen === 'game' && interactiveLoupe.offscreen) renderLoupe();
                };

                img.src = url;
            };
        }

        const QUESTIONS_DATABASE = [
            { id: '1', name: '花繩', category: '試猜出一種遊戲', distractors: ['跳飛機', '抓豆袋', '踢繭子'], hint: '用一條棉繩在雙手十指間翻繞出各種圖案。', desc: '翻花繩是經典的雙人或單人手部遊戲！', draw: drawImageHelper('./images/花繩.png'), cluePoint: {x:0.5, y:0.5}, related: [{emoji:'🤲', text:'雙人遊戲'}, {emoji:'🏫', text:'小息時間'}] },
            { id: '2', name: '叮叮糖', category: '試猜出一種食物', distractors: ['龍鬚糖', '麥芽糖餅', '白雪糕'], hint: '小販會用小錘子和鑿子敲打硬麥芽糖。', desc: '香港傳統硬麥芽糖，發出「叮叮」響聲！', draw: drawImageHelper('./images/叮叮糖.png'), cluePoint: {x:0.5, y:0.5}, related: [{emoji:'🔨', text:'鐵槌與鑿'}, {emoji:'🛒', text:'街邊小販'}] },
            { id: '3', name: '眼鏡朱古力', category: '試猜出一種食物', distractors: ['彩虹糖', '戒指糖', '石頭糖'], hint: '8字形的包裝，常套在頭上當眼鏡。', desc: '經典「8」字形雙孔包裝，裏面裝滿彩衣朱古力豆。', draw: drawImageHelper('./images/眼鏡朱古力.png'), cluePoint: {x:0.25, y:0.5}, related: [{emoji:'➰', text:'串橡皮筋'}, {emoji:'🏪', text:'舊式士多'}] },
            { id: '4', name: '西瓜波', category: '試猜出一種玩具', distractors: ['乒乓球', '皮球', '保齡球'], hint: '紅白相間的塑膠膠球。', desc: '1960-70年代流行的塑膠足球，紅白相間。', draw: drawImageHelper('./images/西瓜波.png'), cluePoint: {x:0.5, y:0.3}, related: [{emoji:'🏢', text:'屋邨走廊'}, {emoji:'👟', text:'白飯魚鞋'}] },

            { id: '44', name: '膠劍仔', category: '試猜出一種玩具', distractors: ['積木', '兵器模型', '牙籤'], hint: '五顏六色、很小把的塑膠劍。', desc: '小學生之間極受歡迎的平價玩具，用手指彈擊。', draw: drawImageHelper('./images/膠劍仔.png'), cluePoint: {x:0.5, y:0.5}, related: [{emoji:'🗡️', text:'五顏六色'}, {emoji:'🤏', text:'手指彈擊'}] },
            { id: '45', name: 'Game Boy', category: '試猜出一種玩具', distractors: ['紅白機', '電子寵物', 'PSP'], hint: '螢幕只有綠黑色，最經典遊戲是俄羅斯方塊。', desc: '任天堂推出的經典掌上遊戲機。', draw: drawImageHelper('./images/Game Boy.png'), cluePoint: {x:0.5, y:0.3}, related: [{emoji:'👾', text:'綠黑螢幕'}, {emoji:'🔋', text:'四粒AA電'}] },

            { id: '48', name: '竹蜻蜓', category: '試猜出一種玩具', distractors: ['陀螺', '風箏', '飛盤'], hint: '一根木棍上面連著螺旋槳，雙手一搓就會飛。', desc: '古老而簡單的飛行玩具，利用雙手搓動產生升力。', draw: drawImageHelper('./images/竹蜻蜓.png'), cluePoint: {x:0.5, y:0.3}, related: [{emoji:'🚁', text:'雙手搓飛'}, {emoji:'🪵', text:'木製螺旋'}] },
            { id: '49', name: '萬花筒', category: '試猜出一種玩具', distractors: ['望遠鏡', '放大鏡', '顯微鏡'], hint: '轉動圓筒，會看到裡面彩色碎片的對稱圖案不斷變化。', desc: '利用鏡子反射原理製成的光學玩具，圖案絢麗無比。', draw: drawImageHelper('./images/萬花筒.png'), cluePoint: {x:0.5, y:0.5}, related: [{emoji:'🌌', text:'鏡面反射'}, {emoji:'🔄', text:'旋轉圓筒'}] },
            { id: '50', name: '紅白機手掣', category: '試猜出一種玩具', distractors: ['Game Boy', '遙控器', '錄影帶'], hint: '長方形遊戲手把，有經典的金色面板和紅色A、B按鈕。', desc: '任天堂紅白機的經典控制器。', draw: drawImageHelper('./images/紅白機手掣.png'), cluePoint: {x:0.5, y:0.5}, related: [{emoji:'🎮', text:'金色面板'}, {emoji:'👆', text:'紅色AB掣'}] }
        ];

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            try {
                const ctx = getAudioContext(); if (!ctx) return;
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination); const now = ctx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.08); osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'win') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1); osc.frequency.setValueAtTime(659.25, now + 0.2); osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        function initLoupeEvents() {
            const canvas = document.getElementById('clue-1');
            if (!canvas || interactiveLoupe.eventsInitialized) return;
            const updatePos = (e) => {
                const rect = canvas.getBoundingClientRect();
                let clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                let clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
                interactiveLoupe.x = Math.max(0, Math.min(interactiveLoupe.displayW, clientX - rect.left));
                interactiveLoupe.y = Math.max(0, Math.min(interactiveLoupe.displayH, clientY - rect.top));
                renderLoupe();
            };
            canvas.addEventListener('mousedown', (e) => { interactiveLoupe.isDragging = true; updatePos(e); });
            canvas.addEventListener('mousemove', (e) => { if (interactiveLoupe.isDragging) updatePos(e); });
            window.addEventListener('mouseup', () => { interactiveLoupe.isDragging = false; });
            canvas.addEventListener('touchstart', (e) => { interactiveLoupe.isDragging = true; updatePos(e); }, {passive: false});
            canvas.addEventListener('touchmove', (e) => { if (interactiveLoupe.isDragging) { e.preventDefault(); updatePos(e); } }, {passive: false});
            window.addEventListener('touchend', () => { interactiveLoupe.isDragging = false; });
            interactiveLoupe.eventsInitialized = true;
        }

        function renderLoupe() {
            const canvas = document.getElementById('clue-1');
            if (!canvas || !interactiveLoupe.offscreen) return;
            const ctx = canvas.getContext('2d');
            const w = interactiveLoupe.displayW, h = interactiveLoupe.displayH;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(interactiveLoupe.offscreen, 0, 0, interactiveLoupe.offscreen.width, interactiveLoupe.offscreen.height, 0, 0, w, h);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)'; ctx.fillRect(0, 0, w, h);
            ctx.save();
            ctx.beginPath(); ctx.arc(interactiveLoupe.x, interactiveLoupe.y, interactiveLoupe.radius, 0, Math.PI * 2); ctx.clip();
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
            ctx.translate(interactiveLoupe.x, interactiveLoupe.y); ctx.scale(interactiveLoupe.zoom, interactiveLoupe.zoom); ctx.translate(-interactiveLoupe.x, -interactiveLoupe.y);
            ctx.drawImage(interactiveLoupe.offscreen, 0, 0, interactiveLoupe.offscreen.width, interactiveLoupe.offscreen.height, 0, 0, w, h);
            ctx.restore();
            ctx.beginPath(); ctx.arc(interactiveLoupe.x, interactiveLoupe.y, interactiveLoupe.radius, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#d97706'; ctx.stroke();
            ctx.beginPath(); ctx.arc(interactiveLoupe.x, interactiveLoupe.y, interactiveLoupe.radius - 3, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = '#fcd34d'; ctx.stroke();
            ctx.beginPath(); ctx.arc(interactiveLoupe.x - interactiveLoupe.radius*0.3, interactiveLoupe.y - interactiveLoupe.radius*0.3, interactiveLoupe.radius*0.4, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(interactiveLoupe.x - interactiveLoupe.radius*0.3, interactiveLoupe.y - interactiveLoupe.radius*0.3, 0, interactiveLoupe.x - interactiveLoupe.radius*0.3, interactiveLoupe.y - interactiveLoupe.radius*0.3, interactiveLoupe.radius*0.4);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad; ctx.fill();
        }

        function showScreen(screenId) {
            gameState.currentScreen = screenId;
            ['menu', 'game', 'reveal', 'result', 'museum'].forEach(s => {
                const el = document.getElementById(`screen-${s}`);
                if (el) { el.classList.toggle('hidden', s !== screenId); el.classList.toggle('flex', s === screenId); }
            });
            const museumBtn = document.getElementById('btn-museum-top'), backBtn = document.getElementById('btn-back-menu'), headerScore = document.getElementById('header-score');
            if (headerScore) {
                if (screenId === 'menu' || screenId === 'museum') { headerScore.classList.add('hidden'); headerScore.classList.remove('flex'); }
                else { headerScore.classList.remove('hidden'); headerScore.classList.add('flex'); }
            }
            if (museumBtn && backBtn) {
                if (screenId === 'menu') { museumBtn.classList.remove('hidden'); museumBtn.classList.add('flex'); backBtn.classList.add('hidden'); backBtn.classList.remove('flex'); }
                else if (screenId === 'game' || screenId === 'reveal') { museumBtn.classList.add('hidden'); museumBtn.classList.remove('flex'); backBtn.classList.remove('hidden'); backBtn.classList.add('flex'); }
                else { museumBtn.classList.add('hidden'); museumBtn.classList.remove('flex'); backBtn.classList.add('hidden'); backBtn.classList.remove('flex'); }
            }
            if (screenId === 'museum') populateMuseum();
            playSound('click');
        }

        function startGame() {
            gameState.score = 0; gameState.streak = 0; gameState.maxStreak = 0; gameState.correctCount = 0; gameState.questionIndex = 0;
            gameState.hintsLeft = 3; gameState.fiftyFiftyLeft = 3; gameState.secondCluesLeft = 3;
            gameState.questionsList = [...QUESTIONS_DATABASE].sort(() => Math.random() - 0.5).slice(0, 20);
            document.getElementById('score-display').innerText = '0';
            showScreen('game'); loadQuestion();
        }

        function loadQuestion() {
            if (gameState.questionIndex >= gameState.questionsList.length) return endGame();
            const q = gameState.questionsList[gameState.questionIndex];
            gameState.currentQuestion = q; gameState.hintUsed = false; gameState.fiftyFiftyUsed = false; gameState.secondClueUsed = false;
            
            const clue3Container = document.getElementById('clue-3-container'), clue3Locked = document.getElementById('clue-3-locked');
            if (clue3Container && clue3Locked) { clue3Container.classList.add('hidden'); clue3Locked.classList.remove('hidden'); }
            
            document.getElementById('question-number-badge').innerText = `第 ${gameState.questionIndex + 1} 題`;
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('hint-banner').classList.add('hidden');
            renderOptions(q); updateToolButtonsUI();
            setTimeout(() => setupCanvases(q), 50);
        }

        function renderOptions(q) {
            const grid = document.getElementById('options-grid'); grid.innerHTML = '';
            const options = [q.name, ...q.distractors].sort(() => Math.random() - 0.5);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "retro-btn py-3 sm:py-4 md:py-5 px-2 md:px-4 rounded-xl md:rounded-2xl text-base sm:text-lg md:text-2xl font-black text-center flex items-center justify-center shadow-md md:shadow-lg truncate tracking-wide leading-tight transition-transform hover:scale-[1.01] active:scale-95";
                btn.innerText = opt; btn.onclick = () => checkAnswer(opt, q);
                grid.appendChild(btn);
            });
        }

        function updateToolButtonsUI() {
            const updateBtn = (btnId, spanId, left, used) => {
                const btn = document.getElementById(btnId), span = document.getElementById(spanId);
                if (btn && span) {
                    span.innerText = left;
                    if (left <= 0 || used) { btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed', 'saturate-0'); }
                    else { btn.disabled = false; btn.classList.remove('opacity-50', 'cursor-not-allowed', 'saturate-0'); }
                }
            };
            updateBtn('btn-hint', 'hint-left', gameState.hintsLeft, gameState.hintUsed);
            updateBtn('btn-5050', '5050-left', gameState.fiftyFiftyLeft, gameState.fiftyFiftyUsed);
            updateBtn('btn-second-clue', 'second-clue-left', gameState.secondCluesLeft, gameState.secondClueUsed);
        }

        function useFiftyFifty() {
            if (gameState.fiftyFiftyUsed || gameState.fiftyFiftyLeft <= 0 || !gameState.currentQuestion) return;
            gameState.fiftyFiftyUsed = true; gameState.fiftyFiftyLeft--;
            const buttons = Array.from(document.getElementById('options-grid').querySelectorAll('button'));
            const distractors = buttons.filter(btn => btn.innerText !== gameState.currentQuestion.name).sort(() => Math.random() - 0.5);
            distractors[0].style.visibility = 'hidden'; distractors[1].style.visibility = 'hidden';
            updateToolButtonsUI(); playSound('click');
        }

        function useSecondClue() {
            if (gameState.secondClueUsed || gameState.secondCluesLeft <= 0 || !gameState.currentQuestion) return;
            gameState.secondClueUsed = true; gameState.secondCluesLeft--;
            document.getElementById('clue-3-locked').classList.add('hidden');
            const c3Container = document.getElementById('clue-3-container'); c3Container.classList.remove('hidden');
            const c3Canvas = document.getElementById('clue-3');
            if (c3Canvas) {
                const s = c3Container.clientWidth || 160; c3Canvas.width = s; c3Canvas.height = s;
                if (gameState.currentQuestion.related[1]) drawContextCard(c3Canvas.getContext('2d'), s, s, gameState.currentQuestion.related[1]);
            }
            updateToolButtonsUI(); playSound('click');
        }

        function useHint() {
            if (gameState.hintUsed || gameState.hintsLeft <= 0 || !gameState.currentQuestion) return;
            gameState.hintUsed = true; gameState.hintsLeft--;
            document.getElementById('hint-text').innerText = gameState.currentQuestion.hint;
            document.getElementById('hint-banner').classList.remove('hidden');
            updateToolButtonsUI(); playSound('click');
        }

        function checkAnswer(selectedOption, question) {
            const isCorrect = (selectedOption === question.name);
            if (isCorrect) {
                playSound('correct'); gameState.correctCount++; gameState.streak++; gameState.maxStreak = Math.max(gameState.maxStreak, gameState.streak);
                const addedPoints = 100 + (gameState.streak > 1 ? (gameState.streak - 1) * 20 : 0); gameState.score += addedPoints;
                document.getElementById('reveal-status-tag').className = "bg-green-600 text-white font-black-shadow px-6 py-2 rounded-full text-xl sm:text-3xl shadow-lg";
                document.getElementById('reveal-status-tag').innerText = "答對了！";
                document.getElementById('reveal-points-tag').innerText = `+${addedPoints} 分`;
            } else {
                playSound('wrong'); gameState.streak = 0;
                document.getElementById('reveal-status-tag').className = "bg-red-600 text-white font-black-shadow px-6 py-2 rounded-full text-xl sm:text-3xl shadow-lg";
                document.getElementById('reveal-status-tag').innerText = `答錯了！答案是「${question.name}」`;
                document.getElementById('reveal-points-tag').innerText = `+0 分`;
            }
            document.getElementById('score-display').innerText = gameState.score;
            document.getElementById('reveal-item-title').innerText = question.name;
            document.getElementById('reveal-item-desc').innerText = question.desc;
            
            const rCanvas = document.getElementById('reveal-canvas');
            if (rCanvas) {
                rCanvas.width = rCanvas.parentElement.clientWidth || 600; rCanvas.height = rCanvas.parentElement.clientHeight || 300;
                question.draw(rCanvas.getContext('2d'), rCanvas.width, rCanvas.height);
            }
            showScreen('reveal');
        }

        function nextQuestion() { gameState.questionIndex++; showScreen('game'); loadQuestion(); }

        function endGame() {
            playSound('win');
            document.getElementById('final-score').innerText = gameState.score;
            let rank = '🌱 懷舊新手', rankDesc = '再接再厲！多去懷舊展覽館看看，重溫美好童年時光！';
            if (gameState.score >= 2000) { rank = '🏆 懷舊宗師'; rankDesc = '神乎其技！你對往昔事物的記憶無人能及！'; }
            else if (gameState.score >= 1000) { rank = '🌟 記憶達人'; rankDesc = '非常厲害！大部分經典童年回憶都難不倒你！'; }
            document.getElementById('rank-title').innerText = rank; document.getElementById('rank-desc').innerText = rankDesc;
            showScreen('result');
        }

        function setupCanvases(question) {
            const c1Canvas = document.getElementById(`clue-1`);
            if (c1Canvas) {
                const w = c1Canvas.parentElement.clientWidth || 300, h = c1Canvas.parentElement.clientHeight || 300;
                c1Canvas.width = w; c1Canvas.height = h;
                const off = document.createElement('canvas'); off.width = 1000; off.height = Math.floor(1000 * (h / w));
                question.draw(off.getContext('2d'), off.width, off.height);
                interactiveLoupe.offscreen = off; interactiveLoupe.displayW = w; interactiveLoupe.displayH = h;
                interactiveLoupe.x = (question.cluePoint||{x:0.5,y:0.5}).x * w; interactiveLoupe.y = (question.cluePoint||{x:0.5,y:0.5}).y * h;
                initLoupeEvents(); renderLoupe();
            }
            const c2Canvas = document.getElementById(`clue-2`);
            if (c2Canvas) {
                const s = Math.floor(Math.min(c2Canvas.parentElement.clientWidth, c2Canvas.parentElement.clientHeight)) || 100;
                c2Canvas.width = s; c2Canvas.height = s;
                if (question.related[0]) drawContextCard(c2Canvas.getContext('2d'), s, s, question.related[0]);
            }
            const c3Container = document.getElementById('clue-3-container');
            if (c3Container && !c3Container.classList.contains('hidden')) {
                const c3Canvas = document.getElementById(`clue-3`);
                if (c3Canvas) {
                    const s = Math.floor(Math.min(c3Container.clientWidth, c3Container.clientHeight)) || 100;
                    c3Canvas.width = s; c3Canvas.height = s;
                    if (question.related[1]) drawContextCard(c3Canvas.getContext('2d'), s, s, question.related[1]);
                }
            }
        }

        function drawContextCard(ctx, w, h, data) {
            ctx.fillStyle = '#fef3c7'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#d97706'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, w-4, h-4);
            const grad = ctx.createRadialGradient(w/2, h/2, w*0.2, w/2, h/2, w*0.8);
            grad.addColorStop(0, 'transparent'); grad.addColorStop(1, 'rgba(0,0,0,0.15)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${Math.floor(w * 0.45)}px sans-serif`;
            ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
            ctx.fillText(data.emoji, w/2, h/2 - h*0.08); ctx.shadowColor = 'transparent';
            const bannerH = h * 0.3; ctx.fillStyle = '#78350f'; ctx.fillRect(0, h - bannerH, w, bannerH);
            ctx.fillStyle = '#fef3c7'; ctx.font = `900 ${Math.min(Math.floor(w * 0.12), 24)}px -apple-system, sans-serif`;
            ctx.fillText(data.text, w/2, h - (bannerH/2));
        }

        function populateMuseum() {
            const grid = document.getElementById('museum-grid'); grid.innerHTML = '';
            QUESTIONS_DATABASE.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-amber-950/90 border-4 border-amber-800 rounded-3xl p-5 md:p-6 flex flex-col justify-between shadow-xl";
                
                // 這裡更新了展覽館排版：標題置中且變大、移除小標籤
                card.innerHTML = `
                    <div>
                        <div class="mb-3">
                            <h3 class="font-black text-amber-300 text-3xl md:text-4xl text-center w-full">${item.name}</h3>
                        </div>
                        <div class="w-full h-40 md:h-56 bg-black/60 rounded-2xl overflow-hidden my-4 md:my-5 relative border-[3px] border-amber-900 shadow-inner">
                            <canvas id="museum-canvas-${item.id}" class="w-full h-full object-contain"></canvas>
                        </div>
                        <p class="text-base md:text-xl text-amber-100 font-bold leading-relaxed">${item.desc}</p>
                    </div>
                `;
                
                grid.appendChild(card);
                setTimeout(() => {
                    const c = document.getElementById(`museum-canvas-${item.id}`);
                    if (c) { c.width = c.parentElement.clientWidth || 250; c.height = c.parentElement.clientHeight || 150; item.draw(c.getContext('2d'), c.width, c.height); }
                }, 50);
            });
        }

        window.onload = () => {
            showScreen('menu');
            window.addEventListener('resize', () => { if (gameState.currentScreen === 'game' && gameState.currentQuestion) setupCanvases(gameState.currentQuestion); });
        };
    </script>
